# M1b best (M2's baseline): M1a section chunking + paragraph citations.
# - chunking.strategy: section (m1a/chunk_section_200: evidence_f1 .297 -> .425, judge .500 -> .556,
#   p95 latency 1851 -> 1451 ms; paragraph-aligned chunks that never cross a section)
# - generation.cite_unit: paragraph (m1b/cite_paragraph: evidence_f1 .297 -> .455, ceiling .524 -> .787)
# Result vs baseline: answer_f1 +.022 [-.015, +.056], evidence_f1 +.194 [+.144, +.242], judge
# .500 -> .568 (see docs/decisions/002-m1b-pipeline.md for the judge validation).
# Chosen over m1b_semantic_best.yaml (semantic chunks + paragraph citations), which is behind on
# Answer-F1, Evidence-F1 and judge accuracy and needs a sentence-embedding pass to chunk.
# Rejected (see evals/results/SUMMARY.md): rerank / hybrid_rerank, multi_query, hyde, prompt_v2,
# source_docling. No Answer-F1 delta in M1b had a 95% CI excluding 0, so this config is chosen
# on Evidence-F1. Reuses the section_200 index (section chunks carry paragraph segments).
extends: baseline.yaml
chunking:
  strategy: section        # paragraph-aligned, never crosses a section
  chunk_size: 200
  chunk_overlap: 0         # unused by 'section'
generation:
  cite_unit: paragraph
eval:
  experiment_name: m1b
  run_name: m1b_best
  reference_run: baseline
