[project]
name = "paperlens"
version = "0.1.0"
description = "Agentic RAG over scientific papers (QASPER), built to measure every design choice."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pyyaml>=6.0",
  "typer>=0.12",
  "structlog>=24.4",
  "tenacity>=9.0",
  "httpx>=0.27",
  "pyarrow>=18",
  "numpy>=2.1",
  "openai>=3.0",
  "qdrant-client>=1.12",
  "bm25s>=0.2",
  "mlflow>=3.1",
  "httpx2>=2.14",
]

[project.optional-dependencies]
ml = ["torch>=2.9", "sentence-transformers>=3.3"]

[project.scripts]
paperlens = "paperlens.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.13", "pre-commit>=4.0", "types-PyYAML"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paperlens"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # line length is the formatter's job

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a CUDA GPU", "ollama: needs a running Ollama server"]
addopts = "-m 'not gpu and not ollama'"
